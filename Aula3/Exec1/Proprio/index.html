<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Formulário - Envio para destino.php</title>
</head>
<body>
<h1>Formulário de Envio</h1>
<form action="destino.php" method="post">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required><br><br>

    <label for="telefone">Telefone:</label>
    <input type="tel" id="telefone" name="telefone" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="mensagem">Mensagem:</label>
    <input id="mensagem" name="mensagem" required></input><br><br>

    <button type="submit">Enviar POST</button>

    <button type="submit" formmethod="get" formaction="destino.php">Abrir como GET</button>
</form>
</body>
</html>
